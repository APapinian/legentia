[workspace]
resolver = "3"
members = ["crates/core", "crates/kobo", "crates/sim"]

[workspace.package]
version = "1.0.0"
edition = "2024"
publish = false
license = "MIT"

# Kullanıcıya görünen her metin i18n katalogundan gelmeli. Doğrudan
# println!/eprintln! yasak; izin verilen tek yer i18n::show_error.
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
